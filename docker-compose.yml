services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mindwell
      POSTGRES_USER: mindwell
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-mindwell}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindwell"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DJANGO_DB_HOST=postgres
      - DJANGO_DB_NAME=mindwell
      - DJANGO_DB_USER=mindwell
      - DJANGO_DB_PASSWORD=${DJANGO_DB_PASSWORD:-mindwell}
      - DJANGO_DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:80
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@mindwell.app}
      - USE_EMAIL=${USE_EMAIL:-False}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: .
    restart: unless-stopped
    command: celery -A mental_health_screening worker --loglevel=info
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DJANGO_DB_HOST=postgres
      - DJANGO_DB_NAME=mindwell
      - DJANGO_DB_USER=mindwell
      - DJANGO_DB_PASSWORD=${DJANGO_DB_PASSWORD:-mindwell}
      - DJANGO_DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@mindwell.app}
      - USE_EMAIL=${USE_EMAIL:-False}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A mental_health_screening beat --loglevel=info
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DJANGO_DB_HOST=postgres
      - DJANGO_DB_NAME=mindwell
      - DJANGO_DB_USER=mindwell
      - DJANGO_DB_PASSWORD=${DJANGO_DB_PASSWORD:-mindwell}
      - DJANGO_DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@mindwell.app}
      - USE_EMAIL=${USE_EMAIL:-False}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
