services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - db_data:/data
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DJANGO_DB_PATH=/data/db.sqlite3
      - CORS_ALLOWED_ORIGINS=http://localhost:80
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@mindwell.app}
      - USE_EMAIL=${USE_EMAIL:-False}
    depends_on:
      - redis

  celery-worker:
    build: .
    restart: unless-stopped
    command: celery -A mental_health_screening worker --loglevel=info
    volumes:
      - db_data:/data
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DJANGO_DB_PATH=/data/db.sqlite3
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@mindwell.app}
      - USE_EMAIL=${USE_EMAIL:-False}
    depends_on:
      - redis
      - backend

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A mental_health_screening beat --loglevel=info
    volumes:
      - db_data:/data
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@mindwell.app}
      - USE_EMAIL=${USE_EMAIL:-False}
    depends_on:
      - redis
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
