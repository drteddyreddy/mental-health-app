[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
"**/management/commands/*.py" = ["E501"]
"**/mail.py" = ["E501", "E741"]
"**/utils.py" = ["E501", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
